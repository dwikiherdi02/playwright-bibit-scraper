            - heading "Profil Produk Reksa Dana" [level=4] [ref=e308]
            - generic [ref=e310]: SUCORINVEST SHARIA EQUITY FUND bertujuan untuk memperoleh pertumbuhan nilai investasi yang optimal dalam jangka panjang dengan melakukan investasi pada Efek Syariah bersifat ekuitas serta Efek Syariah bersifat utang dan instrumen pasar uang syariah sesuai dengan prinsip-prinsip Syariah Islam dan peraturan perundang-undangan yang berlaku di Indonesia. SUCORINVEST SHARIA EQUITY FUND akan melakukan investasi dengan komposisi portofolio investasi (i) minimum 80% dan maksimum sebesar 100% dari Nilai Aktiva Bersih pada Efek Syariah bersifat ekuitas yang diterbitkan korporasi yang telah dijual dalam Penawaran Umum dan/atau diperdagangkan di Bursa Efek Indonesia yang termasuk dalam Daftar Efek Syariah; dan (ii) minimum 0% dan maksimum 20% dari Nilai Aktiva Bersih pada Surat Berharga Syariah Negara dan/atau Sukuk (Obligasi Syariah) yang diterbitkan oleh korporasi berbadan hukum Indonesia dan/atau instrumen pasar uang syariah dalam negeri dan/atau deposito syariah; sesuai dengan peraturan perundang-undangan yang berlaku di Indonesia.
